<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castle Wars 3D</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
        }
    }
    </script>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        
        #health-bar {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #000;
        }
        
        #health-fill {
            width: 100%;
            height: 100%;
            background: #00ff00;
            transition: width 0.3s;
        }

        #game-ui {
            position: fixed;
            top: 10px;
            right: 10px;
            color: white;
            font-family: Arial, sans-serif;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.5);
        }

        .team-score {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
        }

        #red-team {
            background: rgba(255,0,0,0.3);
        }

        #blue-team {
            background: rgba(0,0,255,0.3);
        }
    </style>
</head>
<body>
    <div id="health-bar"><div id="health-fill"></div></div>
    <div id="game-ui">
        <div id="red-team" class="team-score">Red Team: 0</div>
        <div id="blue-team" class="team-score">Blue Team: 0</div>
    </div>
    <script type="module" src="game.js"></script>

</html>
